name: Su Hatirlatici

on:
  # Zamanlama artık cron-job.org tarafından yapılıyor (Europe/Istanbul, her gün 09-23 arası 2 saatte bir).
  # cron-job.org bu workflow'u GitHub API üzerinden workflow_dispatch ile tetikliyor.
  workflow_dispatch:

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node send.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_MAIL: ${{ secrets.VAPID_MAIL }}
